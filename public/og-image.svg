  <rect x="80" y="200" width="64" height="64" rx="8" fill="#ffffff"/>
  <text x="112" y="248" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#0f172a" text-anchor="middle">N</text>

  <!-- Title -->
  <text x="80" y="320" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#ffffff">NeutraleNachrichten</text>

