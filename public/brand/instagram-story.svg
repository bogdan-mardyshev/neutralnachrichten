<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Arial', 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#FFF8F0"/>

  <!-- Top spectrum bar -->
  <rect x="0"   y="0" width="216" height="14" fill="#e11d48"/>
  <rect x="216" y="0" width="216" height="14" fill="#fb923c"/>
  <rect x="432" y="0" width="216" height="14" fill="#94a3b8"/>
  <rect x="648" y="0" width="216" height="14" fill="#0ea5e9"/>
  <rect x="864" y="0" width="216" height="14" fill="#1d4ed8"/>

  <!-- Logo lockup (top) -->
  <rect x="100" y="220" width="104" height="104" fill="#1a1a1a"/>
  <text x="152" y="300" class="serif" font-size="72" font-weight="900"
        fill="#FFF8F0" text-anchor="middle">N</text>
  <text x="224" y="262" class="serif" font-size="38" font-weight="400" fill="#1a1a1a">Neutrale</text>
  <text x="224" y="308" class="serif" font-size="38" font-weight="900" fill="#1a1a1a">Nachrichten</text>
  <rect x="100" y="352" width="880" height="2" fill="#1a1a1a"/>

  <!-- Headline (center) -->
  <text x="100" y="560" class="serif" font-size="92" font-weight="900" fill="#1a1a1a">Wie berichten</text>
  <text x="100" y="664" class="serif" font-size="92" font-weight="900" fill="#1a1a1a">deutsche</text>
  <text x="100" y="768" class="serif" font-size="92" font-weight="900" fill="#1a1a1a">Medien</text>
  <text x="100" y="872" class="serif" font-size="92" font-weight="900" fill="#e11d48">wirklich?</text>

  <text x="102" y="952" class="sans" font-size="30" fill="#64748b">Dieselbe Nachricht.</text>
  <text x="102" y="998" class="sans" font-size="30" fill="#64748b">Fünf politische Perspektiven. Auf einen Blick.</text>

  <!-- Spectrum showcase -->
  <text x="100" y="1130" class="sans" font-size="18" font-weight="700" fill="#94a3b8" letter-spacing="5">POLITISCHES SPEKTRUM</text>
  <rect x="100" y="1146" width="880" height="2" fill="#1a1a1a"/>

  <rect x="100" y="1186" width="10" height="58" fill="#e11d48"/>
  <text x="134" y="1212" class="sans" font-size="16" font-weight="700" fill="#e11d48" letter-spacing="3">LINKS</text>
  <text x="134" y="1238" class="serif" font-size="28" font-weight="700" fill="#1a1a1a">taz · junge Welt · nd</text>

  <rect x="100" y="1266" width="10" height="58" fill="#fb923c"/>
  <text x="134" y="1292" class="sans" font-size="16" font-weight="700" fill="#fb923c" letter-spacing="3">MITTE-LINKS</text>
  <text x="134" y="1318" class="serif" font-size="28" font-weight="700" fill="#1a1a1a">Spiegel · Süddeutsche · Zeit</text>

  <rect x="100" y="1346" width="10" height="58" fill="#94a3b8"/>
  <text x="134" y="1372" class="sans" font-size="16" font-weight="700" fill="#64748b" letter-spacing="3">MITTE</text>
  <text x="134" y="1398" class="serif" font-size="28" font-weight="700" fill="#1a1a1a">Tagesschau · ZDF · Stern</text>

  <rect x="100" y="1426" width="10" height="58" fill="#0ea5e9"/>
  <text x="134" y="1452" class="sans" font-size="16" font-weight="700" fill="#0ea5e9" letter-spacing="3">MITTE-RECHTS</text>
  <text x="134" y="1478" class="serif" font-size="28" font-weight="700" fill="#1a1a1a">FAZ · Welt · Focus</text>

  <rect x="100" y="1506" width="10" height="58" fill="#1d4ed8"/>
  <text x="134" y="1532" class="sans" font-size="16" font-weight="700" fill="#1d4ed8" letter-spacing="3">RECHTS</text>
  <text x="134" y="1558" class="serif" font-size="28" font-weight="700" fill="#1a1a1a">Junge Freiheit · Cicero</text>

  <!-- Footer -->
  <rect x="0" y="1840" width="1080" height="2" fill="#1a1a1a"/>
  <text x="540" y="1884" class="sans" font-size="20" fill="#94a3b8" text-anchor="middle" letter-spacing="3">neutralnachrichten.com</text>

  <!-- Bottom spectrum bar -->
  <rect x="0"   y="1906" width="216" height="14" fill="#e11d48"/>
  <rect x="216" y="1906" width="216" height="14" fill="#fb923c"/>
  <rect x="432" y="1906" width="216" height="14" fill="#94a3b8"/>
  <rect x="648" y="1906" width="216" height="14" fill="#0ea5e9"/>
  <rect x="864" y="1906" width="216" height="14" fill="#1d4ed8"/>
</svg>
