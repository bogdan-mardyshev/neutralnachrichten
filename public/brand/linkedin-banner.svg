<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Arial', 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="#FFF8F0"/>

  <!-- Top spectrum bar -->
  <rect x="0"      y="0" width="316.8" height="9" fill="#e11d48"/>
  <rect x="316.8"  y="0" width="316.8" height="9" fill="#fb923c"/>
  <rect x="633.6"  y="0" width="316.8" height="9" fill="#94a3b8"/>
  <rect x="950.4"  y="0" width="316.8" height="9" fill="#0ea5e9"/>
  <rect x="1267.2" y="0" width="316.8" height="9" fill="#1d4ed8"/>

  <!-- Edition strip -->
  <rect x="0" y="9" width="1584" height="34" fill="#1a1a1a"/>
  <text x="792" y="31" class="sans" font-size="11" font-weight="700"
        fill="white" text-anchor="middle" letter-spacing="5">DEUTSCHLAND · MEDIENANALYSE IN ECHTZEIT · UNABHÄNGIG</text>

  <!-- Logo tile -->
  <rect x="130" y="150" width="108" height="108" fill="#1a1a1a"/>
  <text x="184" y="234" class="serif" font-size="76" font-weight="900"
        fill="#FFF8F0" text-anchor="middle">N</text>

