<svg width="820" height="240" viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Arial', 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="820" height="240" fill="#FFF8F0"/>

  <!-- Top spectrum bar -->
  <rect x="0"   y="0" width="164" height="8" fill="#e11d48"/>
  <rect x="164" y="0" width="164" height="8" fill="#fb923c"/>
  <rect x="328" y="0" width="164" height="8" fill="#94a3b8"/>
  <rect x="492" y="0" width="164" height="8" fill="#0ea5e9"/>
  <rect x="656" y="0" width="164" height="8" fill="#1d4ed8"/>

  <!-- Logo tile -->
  <rect x="48" y="68" width="104" height="104" fill="#1a1a1a"/>
  <text x="100" y="149" class="serif" font-size="72" font-weight="900"
        fill="#FFF8F0" text-anchor="middle">N</text>

  <!-- Wordmark -->
  <text x="180" y="110" class="serif" font-size="46" font-weight="400" fill="#1a1a1a">Neutrale</text>
  <text x="180" y="160" class="serif" font-size="46" font-weight="900" fill="#1a1a1a">Nachrichten</text>

  <!-- Tagline -->
  <text x="182" y="192" class="sans" font-size="14" fill="#64748b" letter-spacing="1">Dieselbe Nachricht. Fünf politische Perspektiven.</text>

  <!-- Bottom spectrum bar -->
  <rect x="0"   y="232" width="164" height="8" fill="#e11d48"/>
  <rect x="164" y="232" width="164" height="8" fill="#fb923c"/>
  <rect x="328" y="232" width="164" height="8" fill="#94a3b8"/>
  <rect x="492" y="232" width="164" height="8" fill="#0ea5e9"/>
  <rect x="656" y="232" width="164" height="8" fill="#1d4ed8"/>
</svg>
