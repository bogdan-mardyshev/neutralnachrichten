name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Tests & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` would trigger the postinstall build; install first, build explicitly.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The suite needs no database and no network: every IO boundary is
      # dependency-injected and faked in tests.
      - name: Run tests
        run: npx vitest run

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build client
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=high
